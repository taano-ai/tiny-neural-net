<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <style>
    .lbl { font-size: 12px; font-weight: bold; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .note { font-size: 12px; fill: #4b5563; }
  </style>
  <rect width="820" height="520" fill="#ffffff"/>

  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Forward pass with example numbers (input x = [1, 0])</text>

  <!-- edges from x1 (blue) -->
  <g stroke="#2563eb" stroke-width="1.5" opacity="0.8">
    <line x1="110" y1="170" x2="400" y2="100"/>
    <line x1="110" y1="170" x2="400" y2="250"/>
    <line x1="110" y1="170" x2="400" y2="400"/>
  </g>
  <!-- edges from x2 (orange) -->
  <g stroke="#ea580c" stroke-width="1.5" opacity="0.8">
    <line x1="110" y1="330" x2="400" y2="100"/>
    <line x1="110" y1="330" x2="400" y2="250"/>
    <line x1="110" y1="330" x2="400" y2="400"/>
  </g>
  <!-- edges hidden -> output (green) -->
  <g stroke="#16a34a" stroke-width="1.5" opacity="0.8">
    <line x1="400" y1="100" x2="690" y2="250"/>
    <line x1="400" y1="250" x2="690" y2="250"/>
    <line x1="400" y1="400" x2="690" y2="250"/>
  </g>

  <!-- input nodes -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <circle cx="110" cy="170" r="30"/>
  </g>
  <g fill="#ffedd5" stroke="#ea580c" stroke-width="2">
    <circle cx="110" cy="330" r="30"/>
  </g>
  <!-- hidden nodes (h2 is grey: ReLU turns it off) -->
  <g stroke="#16a34a" stroke-width="2">
    <circle cx="400" cy="100" r="30" fill="#dcfce7"/>
    <circle cx="400" cy="250" r="30" fill="#e5e7eb"/>
    <circle cx="400" cy="400" r="30" fill="#dcfce7"/>
  </g>
  <!-- output node -->
  <circle cx="690" cy="250" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <!-- node names -->
  <g text-anchor="middle" fill="#111827" font-weight="bold">
    <text x="110" y="175">x1</text>
    <text x="110" y="335">x2</text>
    <text x="400" y="105">h1</text>
    <text x="400" y="255">h2</text>
    <text x="400" y="405">h3</text>
    <text x="690" y="255">ŷ</text>
  </g>

  <!-- input values -->
  <g text-anchor="end" fill="#111827" font-weight="bold">
    <text x="70" y="175">1</text>
    <text x="70" y="335">0</text>
  </g>

  <!-- weights x1 -> hidden (blue, near the input) -->
  <g text-anchor="middle" fill="#2563eb" class="lbl">
    <text class="lbl" x="197" y="149">0.5</text>
    <text class="lbl" x="197" y="194">-1.0</text>
    <text class="lbl" x="197" y="239">2.0</text>
  </g>
  <!-- weights x2 -> hidden (orange, near the hidden layer) -->
  <g text-anchor="middle" fill="#ea580c">
    <text class="lbl" x="313" y="169">1.5</text>
    <text class="lbl" x="313" y="274">0.5</text>
    <text class="lbl" x="313" y="379">-0.5</text>
  </g>
  <!-- weights hidden -> output (green) -->
  <g text-anchor="middle" fill="#16a34a">
    <text class="lbl" x="545" y="175">1.0</text>
    <text class="lbl" x="545" y="245">2.0</text>
    <text class="lbl" x="545" y="325">0.5</text>
  </g>

  <!-- hidden biases (above) and results (below) -->
  <g text-anchor="middle" fill="#374151" class="note">
    <text x="400" y="58">bias = 0</text>
    <text x="400" y="208">bias = 0.5</text>
    <text x="400" y="358">bias = -0.5</text>

    <text x="400" y="150">z = 0.5, ReLU → 0.5</text>
    <text x="400" y="300">z = -0.5, ReLU → 0 (off)</text>
    <text x="400" y="450">z = 1.5, ReLU → 1.5</text>
  </g>

  <!-- output bias and result -->
  <g text-anchor="middle" fill="#374151" class="note">
    <text x="690" y="208">bias = -0.5</text>
    <text x="690" y="300">z = 0.75</text>
    <text x="690" y="318">sigmoid → 0.68</text>
    <text x="690" y="338" font-weight="bold" fill="#dc2626">prediction: class 1</text>
  </g>

  <!-- legend -->
  <g class="note">
    <text x="40" y="488">Numbers on the lines are weights. z = (sum of input × weight) + bias.</text>
    <text x="40" y="506">Blue = weights from x1, orange = weights from x2, green = weights into the output. Example values, not trained.</text>
  </g>
</svg>
